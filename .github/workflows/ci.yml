name: CI and Cloudflare
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.6.0'
      - name: Install Arduino toolchain
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno@1.6.0
          arduino-cli lib install 'ArduinoBLE@2.1.0' 'MFRC522@1.4.12' 'ArduinoMqttClient@0.1.8'
      - run: npm ci
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }}
      - run: npm run build
      - name: Isolated browser checks
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/pip" install playwright==1.58.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
          python3 -m http.server 8000 >"$RUNNER_TEMP/site.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for try in {1..30}; do curl --fail --silent http://localhost:8000/wireless.html >/dev/null && break; sleep 1; done
          "$RUNNER_TEMP/browser-venv/bin/python" tools/test_browser.py
  deploy:
    name: Deploy Cloudflare Pages
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python3 tools/build_site.py
      - name: Verify or create Pages project
        run: python3 tools/ensure_pages_project.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy main to Pages
        run: npx --yes wrangler@4.160.1 pages deploy dist --project-name esc-snowglobe --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
