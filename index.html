<!doctype html>
<!--
  COMPUTER PAGE — the machine that plays the music.
  The pedestal (Arduino + RC522) reads the NFC tag on the bottom of the snow globe
  and says which song is sitting there. This page plays it.

  1. Join the same room as the pedestal (the code printed by the sketch's config.h).
  2. Wait for "pedestal connected".
  3. Click the sound button once, then set a globe on the pedestal.

  Nothing here needs a phone, a camera or a QR code any more.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESC Snowglobe</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: radial-gradient(120% 90% at 50% 0%, #12233a 0%, #05080d 60%, #000 100%);
               color: #f4f7fb; font-family: system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
         text-align: center; padding: 32px; box-sizing: border-box; }
  h1 { font-size: 15px; letter-spacing: .34em; text-transform: uppercase; font-weight: 600;
       color: #8fb6e0; margin: 0; }
  #nowPlaying { font-size: clamp(30px, 6vw, 64px); font-weight: 700; line-height: 1.1; min-height: 1.1em;
                text-shadow: 0 4px 40px rgba(120, 190, 255, .35); }
  #nowPlaying.idle { font-size: 26px; font-weight: 500; color: #7e8ea3; text-shadow: none; }
  #link { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #8fa3ba; flex-wrap: wrap;
          justify-content: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d24b4b; display: inline-block;
         box-shadow: 0 0 12px currentColor; }
  .dot.on { background: #38d47c; }
  #room { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; background: #0d1622;
          color: #cfe4ff; border: 1px solid #24374f; border-radius: 8px; padding: 7px 10px; width: 20ch; text-align: center; }
  #sound { font: inherit; font-size: 22px; font-weight: 700; padding: 20px 40px; border: 0; border-radius: 999px;
           cursor: pointer; color: #10161f; background: #ffb020; box-shadow: 0 0 0 0 rgba(255, 176, 32, .7);
           animation: pulse 1.6s infinite; }
  #sound.on { background: #38d47c; animation: none; cursor: default; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 20px rgba(255, 176, 32, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 176, 32, 0); } }
  #status { font-size: 15px; color: #7e8ea3; min-height: 1.2em; }
  #help { font-size: 13px; color: #56657a; line-height: 1.7; }
  kbd { background: #16222f; border: 1px solid #26374b; border-bottom-width: 2px; border-radius: 5px;
        padding: 1px 6px; font-family: inherit; font-size: 12px; color: #b9cbe0; }
</style>
</head>
<body>
<h1>ESC Snowglobe</h1>
<div id="nowPlaying" class="idle">Waiting for a globe</div>

<div id="link">
  <span class="dot" id="dot"></span>
  <span id="readerState">Pedestal offline</span>
  <span style="opacity:.5">·</span>
  <span>room</span>
  <input id="room" spellcheck="false" autocomplete="off" aria-label="Room code">
</div>

<button id="sound">🔊 Click to turn on sound</button>
<div id="status">Connecting…</div>
<div id="help">Set a globe on the pedestal to play its song · <kbd>1</kbd>–<kbd>4</kbd> test the speakers · <kbd>Esc</kbd> stop</div>

<script src="lib/mqtt.min.js"></script>
<script src="player.js"></script>
<script>
// ---- Settings -------------------------------------------------------------
// Every globe's tag carries one of these slugs, in the order the tag programmer
// lists them. To add a song: drop the mp3 in songs/, add a line here, write the
// slug to a tag. Nothing else changes.
const SONGS = [
  { slug: 'jingle-bells',    title: 'Jingle Bells',           file: 'songs/Frank Sinatra - Jingle Bells 4.mp3' },
  { slug: 'frosty',          title: 'Frosty the Snowman',     file: 'songs/Frosty the Snowman (with lyrics).mp3' },
  { slug: 'rudolph',         title: 'Rudolph the Red-Nosed Reindeer', file: 'songs/Gene Autry - Rudolph the Red-Nosed Reindeer (Audio) 4.mp3' },
  { slug: 'white-christmas', title: 'White Christmas',        file: 'songs/White Christmas (Official Video) 4.mp3' },
];
// Free public message server, same one the pedestal publishes to.
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
// If the pedestal stops talking for this long, the music stops. It publishes
// every second, so this is "unplugged or lost WiFi", not "tag lifted".
const READER_TIMEOUT_MS = 3000;

// ---- Elements -------------------------------------------------------------
const nowEl = document.getElementById('nowPlaying');
const statusEl = document.getElementById('status');
const soundBtn = document.getElementById('sound');
const dotEl = document.getElementById('dot');
const readerEl = document.getElementById('readerState');
const roomEl = document.getElementById('room');

const audio = new Audio();
audio.preload = 'auto';

// ---- Room -----------------------------------------------------------------
const params = new URLSearchParams(location.search);
let room = params.get('room') || localStorage.getItem('roomId') || '';

// ---- Player ---------------------------------------------------------------
let soundOn = false;

function showIdle(text) {
  nowEl.textContent = text || 'Waiting for a globe';
  nowEl.classList.add('idle');
}

function fadeTo(target, then) {
  const start = audio.volume;
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / 180);
    audio.volume = start + (target - start) * k;
    if (k < 1) requestAnimationFrame(step);
    else if (then) then();
  };
  requestAnimationFrame(step);
}

const player = EscPlayer.createPlayer({
  songs: SONGS,
  timeoutMs: READER_TIMEOUT_MS,
  hooks: {
    onPlay(song) {
      audio.pause();
      audio.src = song.file;   // new src always starts from the beginning
      audio.volume = 1;
      const started = audio.play();
      if (started && started.catch) started.catch(() => setSoundOn(false));
      nowEl.textContent = song.title;
      nowEl.classList.remove('idle');
      statusEl.textContent = soundOn ? '' : 'Click the button above to let this page play audio';
    },
    onStop() {
      fadeTo(0, () => { audio.pause(); audio.currentTime = 0; audio.volume = 1; });
      showIdle();
      statusEl.textContent = '';
    },
    onUnknown(slug) {
      statusEl.textContent = 'Tag says "' + slug + '", which is not in SONGS in index.html';
    },
    onReader(id, online) {
      dotEl.classList.toggle('on', online);
      readerEl.textContent = online ? 'Pedestal connected' : 'Pedestal offline';
    },
  },
});

function setSoundOn(on) {
  soundOn = on;
  soundBtn.classList.toggle('on', on);
  soundBtn.textContent = on ? '✓ Sound is on' : '🔊 Click to turn on sound';
}

// Browsers only allow audio after a click on the page.
soundBtn.addEventListener('click', () => {
  if (player.currentSong() !== null) {
    audio.play().catch(() => setSoundOn(false));
  } else {
    // Play and pause once so Safari allows the next real song without another click.
    audio.src = SONGS[0].file;
    audio.play().then(() => { audio.pause(); audio.currentTime = 0; }, () => setSoundOn(false));
  }
  setSoundOn(true);
});

// Keyboard: test the speakers before the pedestal is on the table.
addEventListener('keydown', (e) => {
  if (document.activeElement === roomEl) return;
  if (e.key >= '1' && e.key <= '9') {
    const song = SONGS[Number(e.key) - 1];
    if (song) player.playManually(song.slug);
  } else if (e.key === 'Escape' || e.key === '0') {
    player.stopManually();
  }
});

// ---- Messages -------------------------------------------------------------
let client = null;

function connect() {
  if (!room) {
    showIdle('Set a room code');
    readerEl.textContent = 'No room code';
    statusEl.textContent = 'Copy the room code from config.h in the pedestal sketch, paste it above, press Enter';
    dotEl.classList.remove('on');
    return;
  }
  roomEl.value = room;
  localStorage.setItem('roomId', room);
  if (client) { client.end(true); client = null; }
  statusEl.textContent = 'Connecting…';
  client = mqtt.connect(BROKER);

  client.on('connect', () => {
    statusEl.textContent = 'Looking for the pedestal…';
    client.subscribe('esc-snowglobe/' + room + '/tag');
    client.subscribe('esc-snowglobe/' + room + '/reader');
  });
  client.on('message', (topic, payload) => {
    let msg;
    try { msg = JSON.parse(payload.toString()); } catch { return; }
    if (topic.endsWith('/reader')) player.onReaderStatus(msg);
    else player.onTagMessage(msg);
  });
  client.on('offline', () => {
    dotEl.classList.remove('on');
    readerEl.textContent = 'Pedestal offline';
    statusEl.textContent = 'No internet. Reconnecting…';
  });
  client.on('error', () => { statusEl.textContent = 'Cannot reach the message server. Retrying…'; });
}

roomEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const value = roomEl.value.trim();
  room = value;
  history.replaceState(null, '', value ? '?room=' + encodeURIComponent(value) : location.pathname);
  connect();
});

setInterval(() => player.tick(), 250);
connect();
</script>
</body>
</html>
