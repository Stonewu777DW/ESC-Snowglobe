<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESC Snowglobe</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  video { display: none; }
  #status { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
            text-align: center; font-size: 20px; background: rgba(0, 0, 0, 0.6); }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="status">Tap anywhere to start</div>

<script src="lib/cv.js"></script>
<script src="lib/aruco.js"></script>
<script src="lib/apriltag_36h11.js"></script>
<script>
// Tag ID -> song file. Tags 0-3 of the AprilTag 36h11 family (printables in tags/).
const SONGS = ['songs/song0.mp3', 'songs/song1.mp3', 'songs/song2.mp3', 'songs/song3.mp3'];
// How long a tag may be out of view before its song stops (covers missed frames).
const LOST_MS = 500;
// Frames are downscaled to this width before detection to keep phones fast.
const DETECT_WIDTH = 480;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const statusEl = document.getElementById('status');
const detector = new AR.Detector({ dictionaryName: 'APRILTAG_36h11' });
const audio = new Audio();

let currentTag = null;
let lastSeen = 0;

document.addEventListener('click', async () => {
  // Phones only allow audio after a tap: play once muted inside this tap to unlock the element.
  audio.src = SONGS[0];
  audio.muted = true;
  await audio.play().catch(() => {});
  audio.pause();
  audio.muted = false;

  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
  } catch (err) {
    statusEl.textContent = 'Camera blocked: ' + err.message + '. Reload to try again.';
    return;
  }
  await video.play();
  statusEl.textContent = 'Show a tag to the camera';
  requestAnimationFrame(tick);
}, { once: true });

function play(tag) {
  currentTag = tag;
  audio.src = SONGS[tag];
  audio.currentTime = 0;
  audio.play().catch(err => { statusEl.textContent = 'Could not play ' + SONGS[tag] + ': ' + err.message; });
  statusEl.textContent = 'Tag ' + tag + ': playing';
}

function stop() {
  audio.pause();
  audio.currentTime = 0;
  currentTag = null;
  statusEl.textContent = 'Show a tag to the camera';
}

function tick() {
  canvas.width = DETECT_WIDTH;
  canvas.height = Math.round(DETECT_WIDTH * video.videoHeight / video.videoWidth);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const markers = detector.detect(ctx.getImageData(0, 0, canvas.width, canvas.height))
    .filter(m => m.id < SONGS.length);
  const ids = markers.map(m => m.id);
  const now = performance.now();

  if (currentTag !== null && ids.includes(currentTag)) {
    lastSeen = now;
  } else if (ids.length > 0) {
    lastSeen = now;
    play(ids[0]);
  } else if (currentTag !== null && now - lastSeen > LOST_MS) {
    stop();
  }

  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 3;
  for (const m of markers) {
    ctx.beginPath();
    m.corners.forEach(c => ctx.lineTo(c.x, c.y));
    ctx.closePath();
    ctx.stroke();
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
