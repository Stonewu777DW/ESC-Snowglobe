<!doctype html>
<!--
  PHONE PAGE
  Opened by scanning the QR code on the computer page (the link ends in #<room code>).
  1. Connects to the message server and waits until the computer page is open.
  2. Starts the front camera and looks for AprilTags (family 36h11, IDs 0-3) in every frame.
  3. Tells the computer which tag is in view (or none), so it can play or stop that tag's song.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESC Snowglobe</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  /* The camera image is drawn on the canvas, mirrored like a selfie camera. */
  canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  video { display: none; }
  /* Visual hint for where to hold the tag. Tags are detected anywhere in the picture. */
  #guide { position: fixed; top: 50%; left: 50%; width: 85vmin; height: 85vmin; transform: translate(-50%, -55%);
           border: 4px dashed rgba(255, 255, 255, 0.7); border-radius: 16px; pointer-events: none; }
  #status { position: fixed; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom));
            padding: 16px 20px; border-radius: 16px; text-align: center; font-size: 22px; font-weight: 600;
            background: rgba(0, 0, 0, 0.75); }
  #status.playing { background: #2ecc71; color: #000; }
  body.playing #guide { border-style: solid; border-color: #2ecc71; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="guide"></div>
<div id="status">Starting…</div>

<script src="lib/cv.js"></script>
<script src="lib/aruco.js"></script>
<script src="lib/apriltag_36h11.js"></script>
<script src="lib/mqtt.min.js"></script>
<script>
// ---- Settings ----
// Tags 0-3 each pick a song on the computer (printable tags are in tags/).
const TAG_COUNT = 4;
// A tag must stay in view this long before its song starts, so a quick flash does nothing.
const START_MS = 500;
// A tag may be out of view this long before its song stops (covers blurry or missed frames).
const LOST_MS = 500;
// Frames are shrunk to this width before looking for tags. Bigger finds smaller or farther tags,
// but costs more phone power. 800 finds a tag that is about 1/12 of the picture's width.
const DETECT_WIDTH = 800;
// Free public message server that passes messages between phone and computer on any network.
const BROKER = 'wss://broker.emqx.io:8084/mqtt';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const statusEl = document.getElementById('status');
const detector = new AR.Detector({ dictionaryName: 'APRILTAG_36h11' });

// The room code after the # in the link; it matches this phone to one computer.
const room = location.hash.slice(1);
const topic = 'esc-snowglobe/' + room;
let client = null;

let currentTag = null; // the tag whose song is playing, or null
const firstSeen = [];  // per tag: when it came into view
const lastSeen = [];   // per tag: when it was last seen
let cameraStarted = false;

function show(text, playing = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('playing', playing);
  document.body.classList.toggle('playing', playing);
}

// ---- Talking to the computer ----
function sendTag() {
  client.publish(topic + '/tag', JSON.stringify({ phone: client.options.clientId, tag: currentTag }));
}

function setTag(tag) {
  currentTag = tag;
  sendTag();
  show(tag === null ? 'Hold a tag up to the camera' : '♪ Tag ' + tag + ' is playing', tag !== null);
}

if (!room) {
  show('Scan the QR code on the game computer');
} else {
  show('Connecting to the computer…');
  client = mqtt.connect(BROKER);
  client.on('connect', () => client.subscribe(topic + '/computer'));
  client.on('offline', () => show('No internet. Reconnecting…'));
  // The computer page posts 'online' while it is open and 'offline' once it closes.
  client.on('message', (_, payload) => {
    if (payload.toString() !== 'online') {
      show('The computer page is closed. Open it again');
    } else if (!cameraStarted) {
      startCamera();
      // Repeat the current tag every second so the computer notices if this phone disappears.
      setInterval(sendTag, 1000);
    } else {
      show('Hold a tag up to the camera');
    }
  });
}

// ---- Camera and tag detection ----
async function startCamera() {
  cameraStarted = true;
  try {
    // Ask for HD; phones often give a low-resolution picture otherwise, which hides small tags.
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
  } catch (err) {
    show('Camera blocked: ' + err.message + '. Allow the camera and reload.');
    return;
  }
  await video.play();
  show('Hold a tag up to the camera');
  requestAnimationFrame(tick);
}

// Runs once per camera frame.
function tick() {
  canvas.width = DETECT_WIDTH;
  canvas.height = Math.round(DETECT_WIDTH * video.videoHeight / video.videoWidth);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const markers = detector.detect(ctx.getImageData(0, 0, canvas.width, canvas.height))
    .filter(m => m.id < TAG_COUNT);

  // Remember when each tag appeared and when it was last seen.
  const now = performance.now();
  const inView = id => now - lastSeen[id] <= LOST_MS;
  for (const m of markers) {
    if (!inView(m.id)) firstSeen[m.id] = now;
    lastSeen[m.id] = now;
  }

  // Keep the current song while its tag is in view. Otherwise switch to a tag that has been
  // held steady for START_MS, or stop.
  if (currentTag === null || !inView(currentTag)) {
    const ready = [...Array(TAG_COUNT).keys()].find(id => inView(id) && lastSeen[id] - firstSeen[id] >= START_MS);
    if (ready !== undefined) setTag(ready);
    else if (currentTag !== null) setTag(null);
  }

  // Outline found tags in green.
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 4;
  for (const m of markers) {
    ctx.beginPath();
    m.corners.forEach(c => ctx.lineTo(c.x, c.y));
    ctx.closePath();
    ctx.stroke();
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
